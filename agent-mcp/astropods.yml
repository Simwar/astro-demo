# yaml-language-server: $schema=https://astropods.com/schema/package.json
spec: package/v1
name: cross-tool-assistant
meta: {}

agent:
  # astro_ai_gateway: true
  build:
    context: .
    dockerfile: Dockerfile
  interfaces:
    # frontend exposes an HTTP endpoint, so Astro injects ASTRO_EXTERNAL_AGENT_URL
    # and routes the public host to the OAuth callback the agent serves on :80 —
    # enabling hands-free OAuth completion on a deployed agent. messaging is the
    # chat interface.
    frontend: true
    messaging: true
  # No OAuth inputs needed: the redirect URL is forged from
  # ASTRO_EXTERNAL_AGENT_URL (deploy) or localhost (dev), the callback port
  # honors the injected PORT, and tokens persist in Redis (knowledge.cache).
  # The code still honors OAUTH_REDIRECT_URL / OAUTH_CALLBACK_PORT /
  # OAUTH_STORE_DIR via env if ever set, but they aren't prompted at deploy.

models:
  anthropic:
    provider: anthropic

# Writable token store for OAuth credentials. The deployed container FS is
# read-only, so tokens (and refresh tokens) persist in Redis. Injects REDIS_URL.
knowledge:
  cache:
    provider: redis

dev:
  interfaces:
    messaging:
      adapters: [web]
    # Local frontend port (prod always uses :80). The agent serves the OAuth
    # callback here; the playground chat stays on its own port.
    frontend:
      port: 8808
